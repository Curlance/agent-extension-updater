<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210" role="img" aria-label="Extension maintenance workflow">
  <title>Extension maintenance workflow</title>
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="209" rx="20" fill="#0f172a" stroke="#1e293b"/>
  <text class="t" x="36" y="54" font-size="22" font-weight="700" fill="#e2e8f0">Extension maintenance workflow</text>
  <text class="t" x="36" y="79" font-size="14" fill="#94a3b8">From discovery to verification, with evidence at every step</text>
  <rect x="36" y="94" width="888" height="2" rx="1" fill="url(#accent)" opacity="0.45"/>

  <rect x="36" y="100" width="128" height="84" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text class="t" x="100" y="126" font-size="11" fill="#64748b" text-anchor="middle">01</text>
  <text class="t" x="100" y="152" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Inventory</text>
  <text class="t" x="100" y="172" font-size="12" fill="#94a3b8" text-anchor="middle">List extensions</text>

  <rect x="188" y="100" width="128" height="84" rx="14" fill="#1e293b" stroke="#5b74f0" stroke-width="1.5"/>
  <text class="t" x="252" y="126" font-size="11" fill="#64748b" text-anchor="middle">02</text>
  <text class="t" x="252" y="152" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Check upstream</text>
  <text class="t" x="252" y="172" font-size="12" fill="#94a3b8" text-anchor="middle">Source / version</text>

  <rect x="340" y="100" width="128" height="84" rx="14" fill="#1e293b" stroke="#4f8cec" stroke-width="1.5"/>
  <text class="t" x="404" y="126" font-size="11" fill="#64748b" text-anchor="middle">03</text>
  <text class="t" x="404" y="152" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Confirm scope</text>
  <text class="t" x="404" y="172" font-size="12" fill="#94a3b8" text-anchor="middle">Scope / exclusions</text>

  <rect x="492" y="100" width="128" height="84" rx="14" fill="#1e293b" stroke="#3aa8e4" stroke-width="1.5"/>
  <text class="t" x="556" y="126" font-size="11" fill="#64748b" text-anchor="middle">04</text>
  <text class="t" x="556" y="152" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Back up</text>
  <text class="t" x="556" y="172" font-size="12" fill="#94a3b8" text-anchor="middle">SHA-256</text>

  <rect x="644" y="100" width="128" height="84" rx="14" fill="#1e293b" stroke="#2ac2dc" stroke-width="1.5"/>
  <text class="t" x="708" y="126" font-size="11" fill="#64748b" text-anchor="middle">05</text>
  <text class="t" x="708" y="152" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Update</text>
  <text class="t" x="708" y="172" font-size="12" fill="#94a3b8" text-anchor="middle">Pinned commit</text>

  <rect x="796" y="100" width="128" height="84" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="t" x="860" y="126" font-size="11" fill="#64748b" text-anchor="middle">06</text>
  <text class="t" x="860" y="152" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">Verify</text>
  <text class="t" x="860" y="172" font-size="12" fill="#94a3b8" text-anchor="middle">Exact path</text>

  <path d="M171 136l8 6-8 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M323 136l8 6-8 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M475 136l8 6-8 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M627 136l8 6-8 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M779 136l8 6-8 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

</svg>

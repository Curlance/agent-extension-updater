    <circle cx="689" cy="370" r="4" fill="#67e8f9"/>
    <text x="704" y="375" font-size="14" font-weight="600" fill="#b4ecf3">Verify the exact path, commit, and version</text>
    <text x="684" y="402" font-size="12" fill="#97aec6">Record results and backup paths · Host reload still required</text>
  </g>
